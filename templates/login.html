<!DOCTYPE html>
<html dir="rtl" lang="fa" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه مدیریت پروژه</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tailwindcss/rtl@0.2.0/dist/tailwind-rtl.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1A3C34, #2E7D32);
        }
        .dark body {
            background: linear-gradient(to bottom, #0D1F1A, #1A3C34);
        }
        .error-message {
            color: #E53935;
            display: none;
        }
        .dark .error-message {
            color: #F87171;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 text-center mb-6">ورود به سامانه</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">رمز عبور</label>
                <input type="password" id="password" name="password" class="mt-1 w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-green-600 dark:bg-gray-700 dark:text-gray-100" placeholder="رمز عبور را وارد کنید" required>
            </div>
            <p id="error-message" class="error-message text-sm">رمز عبور نادرست است!</p>
            <button type="submit" id="login-btn" class="w-full bg-green-800 text-white py-2 rounded-lg hover:bg-green-700 dark:hover:bg-green-600 transition">ورود</button>
            <button type="button" id="set-password-btn" class="w-full bg-gray-600 text-white py-2 rounded-lg hover:bg-gray-500 dark:hover:bg-gray-400 transition hidden">تنظیم رمز جدید</button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
            <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100 text-center mb-4">فراموشی رمز عبور</h2>
            <div class="space-y-4">
                <div>
                    <label for="secret-phrase" class="block text-sm font-medium text-gray-700 dark:text-gray-300">عبارت خاص</label>
                    <input type="password" id="secret-phrase" class="mt-1 w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 dark:bg-gray-700 dark:text-gray-100" placeholder="عبارت خاص را وارد کنید">
                </div>
                <p id="reset-error-message" class="error-message text-sm">عبارت خاص نادرست است!</p>
                <button type="button" id="reset-password-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-500 dark:hover:bg-blue-700 transition">ریست رمز عبور</button>
            </div>
        </div>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const setPasswordBtn = document.getElementById('set-password-btn');
        const errorMessage = document.getElementById('error-message');
        const loginForm = document.getElementById('login-form');

        const secretPhraseInput = document.getElementById('secret-phrase');
        const resetPasswordBtn = document.getElementById('reset-password-btn');
        const resetErrorMessage = document.getElementById('reset-error-message');

        // Helper function to display error messages
        function displayError(element, errorData, defaultMessage) {
            if (errorData && Array.isArray(errorData.detail)) {
                const messages = errorData.detail.map(err => err.msg);
                element.textContent = messages.join(', ') || defaultMessage;
            } else if (errorData && errorData.detail) {
                element.textContent = errorData.detail;
            } else {
                element.textContent = defaultMessage;
            }
            element.style.display = 'block';
        }

        // چک کردن وجود رمز در دیتابیس
        fetch('http://127.0.0.1:8000/api/check-password', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            if (!data.has_password) {
                loginBtn.classList.add('hidden');
                setPasswordBtn.classList.remove('hidden');
                document.getElementById('password').placeholder = "رمز عبور جدید را وارد کنید";
            }
        })
        .catch(error => {
            console.error('خطا در چک کردن رمز:', error);
            errorMessage.textContent = 'خطا در اتصال به سرور';
            errorMessage.style.display = 'block';
        });

        // مدیریت لاگین

        // مدیریت لاگین
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.style.display = 'none';
            const password = passwordInput.value;
            
            try {
                const response = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `password=${encodeURIComponent(password)}`,
                    credentials: 'include'  // این خط را اضافه کنید
                });

                if (response.status === 303) {
                    // ریدایرکت دستی به صفحه اصلی
                    window.location.href = 'http://127.0.0.1:8000/';
                } else if (response.ok) {
                    // اگر پاسخ OK باشد
                    window.location.href = 'http://127.0.0.1:8000/';
                } else {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = { detail: 'خطا در ورود: پاسخ سرور قابل پردازش نیست.' };
                    }
                    displayError(errorMessage, errorData, 'رمز عبور نادرست است!');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'خطا در اتصال به سرور';
                errorMessage.style.display = 'block';
            }
        });
        // مدیریت تنظیم رمز جدید
        setPasswordBtn.addEventListener('click', async () => {
            errorMessage.style.display = 'none';
            const password = passwordInput.value;
            if (password.length < 6) {
                errorMessage.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشد!';
                errorMessage.style.display = 'block';
                return;
            }
            try {
                const response = await fetch('http://127.0.0.1:8000/settings/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: password })
                });
                if (response.ok) {
                    alert('رمز با موفقیت تنظیم شد!');
                    window.location.href = 'http://127.0.0.1:8000/';
                } else {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = { detail: 'خطا در تغییر رمز: پاسخ سرور قابل پردازش نیست.' };
                    }
                    displayError(errorMessage, errorData, 'خطا در تنظیم رمز جدید!');
                }
            } catch (error) {
                console.error('Set password error:', error);
                errorMessage.textContent = 'خطا در اتصال به سرور';
                errorMessage.style.display = 'block';
            }
        });

        // مدیریت ریست رمز عبور
        resetPasswordBtn.addEventListener('click', async () => {
            resetErrorMessage.style.display = 'none';
            const secretPhrase = secretPhraseInput.value;

            try {
                const response = await fetch('http://127.0.0.1:8000/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret_phrase: secretPhrase })
                });

                if (response.ok) {
                    alert('رمز عبور با موفقیت به "admin123" ریست شد!');
                    passwordInput.value = '';
                    secretPhraseInput.value = '';
                    errorMessage.style.display = 'none';
                    resetErrorMessage.style.display = 'none';
                } else {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = { detail: 'خطا در ریست رمز: پاسخ سرور قابل پردازش نیست.' };
                    }
                    displayError(resetErrorMessage, errorData, 'عبارت خاص نامعتبر است!');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                resetErrorMessage.textContent = 'خطا در اتصال به سرور';
                resetErrorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
